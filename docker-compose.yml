services:
  linkding:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${LD_CONTAINER_NAME}
    ports:
      - "${LD_HOST_PORT}:9090"  # Maps the host port to container port 9090
    volumes:
      - ${LD_HOST_DATA_DIR}:/app/data  # Mount the data directory into the container
    env_file:
      - .env  # Load environment variables from the .env file
    restart: unless-stopped  # Restart the container if it stops unexpectedly
